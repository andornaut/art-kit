name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
      - name: Provision pinned dependencies in isolated containers
        run: bash scripts/provision.sh .claude/dependencies
      - name: Check the package and required native font rendering offline
        run: bash scripts/check.sh .claude/dependencies/node/node_modules
      - name: Build committed release artifacts offline
        run: bash scripts/pack.sh .claude/dependencies/node/node_modules .claude/release-output
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: art-kit-${{ github.sha }}
          path: |
            .claude/release-output/art-kit-*.tgz
            .claude/release-output/SHA256SUMS
            .claude/release-output/SOURCE_COMMIT
          if-no-files-found: error
          include-hidden-files: true
