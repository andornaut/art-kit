name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Provisioning, offline checks and packaging normally complete within fifteen minutes;
    # a job still running at fifteen has hung rather than completed its bounded work.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
      # The action bundles markdownlint-cli2, so its own tag is the tool pin and
      # Dependabot proposes the bump through the github-actions ecosystem. It
      # fetches nothing at run time, so a slow host cannot turn this red.
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          # Empty on purpose. The action defaults this to `*.{md,markdown}`,
          # which is the repository root only, and anything passed here outranks
          # the `globs` in .markdownlint-cli2.yaml. Empty leaves the config file
          # deciding, so this gate and a local `markdownlint-cli2` read one list.
          globs: ""
      # -x follows a `source` into the file it names and -P SCRIPTDIR looks for
      # it beside the script doing the sourcing, which shellcheck cannot resolve
      # on its own. Set everywhere rather than only where something sources
      # today, so a script that starts to is already covered.
      #
      # node_modules is skipped because a Lint job that installs dependencies
      # would otherwise answer for shell a dependency ships.
      - name: Run ShellCheck
        # Followed at the commit rather than at the 2.0.0 tag, which is the newest
        # the action has: it has had no release since 2023, so nothing upstream
        # would notice the tag being moved. The tag is named beside the sha so a
        # reader can tell which release this is.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -x -P SCRIPTDIR
        with:
          # Pinned rather than the action's `stable` default, which names a
          # moving release the action downloads at run time: without this a
          # ShellCheck release turns every one of these gates red on a commit
          # that did not touch them. Dependabot does not read an action input,
          # so this moves by hand.
          version: v0.11.0
          ignore_paths: node_modules
          scandir: "."
      - name: Provision pinned dependencies in isolated containers
        run: bash scripts/provision.sh .claude/dependencies
      - name: Check the package and required native font rendering offline
        run: bash scripts/check.sh .claude/dependencies/node/node_modules
      - name: Build committed release artifacts offline
        run: bash scripts/pack.sh .claude/dependencies/node/node_modules .claude/release-output
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: art-kit-${{ github.sha }}
          path: |
            .claude/release-output/art-kit-*.tgz
            .claude/release-output/SHA256SUMS
            .claude/release-output/SOURCE_COMMIT
          if-no-files-found: error
          include-hidden-files: true
