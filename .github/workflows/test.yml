name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Provisioning, checks and packaging normally complete within fifteen minutes;
    # a job still running at fifteen has hung rather than completed its bounded work.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3
      - name: Check lint, tests and build in stock images
        run: make check
      - name: Provision pinned dependencies in isolated containers
        run: bash scripts/provision.sh .claude/dependencies
      - name: Build committed release artifacts offline
        run: bash scripts/pack.sh .claude/dependencies/node/node_modules .claude/release-output
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: art-kit-${{ github.sha }}
          path: |
            .claude/release-output/art-kit-*.tgz
            .claude/release-output/SHA256SUMS
            .claude/release-output/SOURCE_COMMIT
          if-no-files-found: error
          include-hidden-files: true
