[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "art-kit"
version = "0.9.0"
description = "Explicit pixel-art drawing, Aseprite export and bitmap-font mechanisms."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["Pillow==13.0.0"]

[project.optional-dependencies]
dev = ["ruff==0.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Source = "https://github.com/andornaut/art-kit"

[tool.setuptools.package-data]
art_kit = ["SOURCE_COMMIT"]
